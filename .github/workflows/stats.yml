name: Update stats cards

on:
  schedule:
    - cron: "0 3 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate cards (includes private repos)
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/generate_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: update stats cards" && git push)
