<svg xmlns="http://www.w3.org/2000/svg" width="455" height="205" viewBox="0 0 455 205" role="img" aria-label="Most Used Languages">
<style>
  .t { font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif; font-size: 18px; font-weight: 600; fill: #58a6ff; }
  .l { font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif; font-size: 14px; fill: #8b949e; }
  .v { font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
  .big { font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif; font-size: 30px; font-weight: 700; fill: #e6edf3; }
  .fade { opacity: 0; animation: in .6s ease-out forwards; }
  @keyframes in { to { opacity: 1; } }
  @keyframes grow { from { width: 0; } }
</style>
<rect x="0.5" y="0.5" width="454" height="204" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="25" y="38" class="t">Most Used Languages</text>
<clipPath id="r"><rect x="25" y="58" width="405" height="10" rx="5"/></clipPath><g clip-path="url(#r)">
<rect x="25.0" y="58" width="304.1" height="10" fill="#00B4AB" style="animation:grow .8s ease-out"/>
<rect x="328.6" y="58" width="63.7" height="10" fill="#3178c6" style="animation:grow .8s ease-out"/>
<rect x="391.8" y="58" width="35.9" height="10" fill="#4F5D95" style="animation:grow .8s ease-out"/>
<rect x="427.2" y="58" width="1.9" height="10" fill="#f1e05a" style="animation:grow .8s ease-out"/>
<rect x="428.6" y="58" width="1.9" height="10" fill="#3572A5" style="animation:grow .8s ease-out"/>
</g>
<g class="fade" style="animation-delay:0ms"><circle cx="31" cy="95" r="6" fill="#00B4AB"/><text x="45" y="100" class="v">Dart</text><text x="215" y="100" class="l" text-anchor="end">75.0%</text></g>
<g class="fade" style="animation-delay:120ms"><circle cx="241" cy="95" r="6" fill="#3178c6"/><text x="255" y="100" class="v">TypeScript</text><text x="425" y="100" class="l" text-anchor="end">15.6%</text></g>
<g class="fade" style="animation-delay:240ms"><circle cx="31" cy="125" r="6" fill="#4F5D95"/><text x="45" y="130" class="v">PHP</text><text x="215" y="130" class="l" text-anchor="end">8.7%</text></g>
<g class="fade" style="animation-delay:360ms"><circle cx="241" cy="125" r="6" fill="#f1e05a"/><text x="255" y="130" class="v">JavaScript</text><text x="425" y="130" class="l" text-anchor="end">0.4%</text></g>
<g class="fade" style="animation-delay:480ms"><circle cx="31" cy="155" r="6" fill="#3572A5"/><text x="45" y="160" class="v">Python</text><text x="215" y="160" class="l" text-anchor="end">0.3%</text></g>
</svg>
